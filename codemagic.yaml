workflows:
  ios-unsigned:
    name: Flutter iOS Unsigned Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build Runner.app with signing disabled
        script: |
          flutter build ios --release --no-codesign
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package Runner.app into IPA
        script: |
          mkdir -p Payload
          cp -R build/ios_derived/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r StealthChat-unsigned.ipa Payload
    artifacts:
      - StealthChat-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
